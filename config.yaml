# Alternatively, provide the full QTY sequence
# If provided, mutations will be auto-detected by comparison to WT
qty_sequence: null  # Set to your full QTY sequence string, or leave as null

# Wild-type sequence for comparison (UniProt P35372, residues 65-352 for 7TM)
wt_sequence: null  # Will be extracted from 8EF5 if null

# =============================================================================
# Relaxation/Minimization Settings
# =============================================================================
relaxation:
  method: "openmm"  # openmm or rosetta
  forcefield: "amber14-all.xml"
  water_model: "amber14/tip3pfb.xml"
  
  # Minimization settings
  minimization:
    max_iterations: 1000
    tolerance: 10.0  # kJ/mol/nm
  
  # Short relaxation MD
  relaxation_md:
    steps: 25000  # 50 ps at 2 fs timestep
    temperature: 300  # Kelvin
    
  # Ensemble generation
  ensemble:
    n_structures: 20  # Generate 20 relaxed conformations
    seeds: null  # Will auto-generate if null

# =============================================================================
# Docking Settings
# =============================================================================
docking:
  program: "smina"  # smina or vina
  
  # Box definition (will be auto-centered on fentanyl from 8EF5)
  box:
    center: null  # Auto-detect from ligand COM
    size: [25, 25, 25]  # Box size in Angstroms
    
  # Docking parameters
  exhaustiveness: 32
  num_modes: 20
  energy_range: 5  # kcal/mol
  
  # Scoring
  scoring: "vinardo"  # vinardo or default vina

# =============================================================================
# MD Simulation Settings
# =============================================================================
md_simulation:
  # System setup
  box_padding: 12.0  # Angstroms from protein
  ionic_strength: 0.15  # Molar NaCl
  
  # Equilibration
  equilibration:
    nvt_steps: 50000  # 100 ps NVT
    npt_steps: 250000  # 500 ps NPT
    restraint_force: 100.0  # kJ/mol/nm^2 on backbone
    
  # Production MD
  production:
    duration_ns: 50  # nanoseconds per run
    n_replicates: 3
    timestep_fs: 2.0
    save_interval_ps: 10  # Save every 10 ps
    
  # Restraint schedule (gradually release)
  restraints:
    initial_backbone: 100.0  # kJ/mol/nm^2
    release_steps: 5
    release_duration_ps: 100  # Per step

# =============================================================================
# Analysis Settings
# =============================================================================
analysis:
  # Ligand RMSD threshold for "bound"
  rmsd_threshold: 3.0  # Angstroms
  
  # Key residues to monitor (based on 8EF5 structure)
  # CRITICAL: These are the residue numbers from the actual sequence
  key_residues:
    asp_3_32: 147  # Asp3.32 - CRITICAL for opioid binding (PRESERVED in QTY)
    tyr_3_33: 148  # Tyr3.33 - ⚠️ I148T mutation here
    his_6_52: 297  # His6.52
    trp_6_48: 293  # Trp6.48 (toggle switch) - ⚠️ V293T nearby
    ile_6_53: 298  # ⚠️ I298T mutation here
    
  # Pocket residues to monitor for collapse (some are mutated)
  pocket_residues_to_watch:
    - 147  # Asp3.32 - preserved
    - 148  # I148T - mutated
    - 293  # V293T - mutated  
    - 298  # I298T - mutated
    - 302  # V302T - mutated
    
  # Salt bridge distance cutoff
  salt_bridge_cutoff: 4.0  # Angstroms
  
  # MM/GBSA settings
  mmgbsa:
    method: "MMPBSA.py"  # or gmx_MMPBSA
    frames_stride: 10

# =============================================================================
# Control Runs
# =============================================================================
controls:
  run_wt: true  # Run WT μOR as positive control
  run_negative: true  # Run Asp3.32Ala as negative control
  negative_mutation: "D147A"  # Adjust residue number for your structure
