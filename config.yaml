# QTY μOR - Fentanyl Docking Pipeline Configuration
# ================================================

# Project settings
project_name: "QTY_uOR_Fentanyl"
output_dir: "results"

# PDB settings
pdb:
  id: "8EF5"  # Fentanyl-bound human μOR–Gi structure
  chain_receptor: "R"  # μOR chain in 8EF5
  ligand_name: "7V7"  # Fentanyl residue name in 8EF5 (verified)
  keep_waters: true  # Keep pocket waters within 5Å of ligand
  water_distance_cutoff: 5.0  # Angstroms

# =============================================================================
# QTY MUTATIONS - EDIT THIS SECTION
# =============================================================================
# Format: list of mutations as "original_residue + residue_number + new_residue"
# Example: L52Q means Leucine at position 52 mutated to Glutamine
# 
# QTY Code: 
#   L (Leucine) → Q (Glutamine)
#   I (Isoleucine) → T (Threonine)  
#   V (Valine) → T (Threonine)
#   F (Phenylalanine) → Y (Tyrosine)
#
# IMPORTANT: Enter your QTY mutations below
# Use μOR numbering from 8EF5 structure (or UniProt P35372)
# =============================================================================

qty_mutations:
  # QTY mutations for OPRM1 (77 total)
  # Generated from sequence comparison
  # TM1
  - "I71T"
  - "I73T"
  - "L76Q"
  - "I79T"
  - "V80T"
  - "V82T"
  - "V83T"
  - "L85Q"
